<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Gokil Full Screen</title>
    <style>
        body { 
            margin: 0; background: #000; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow-x: hidden; font-family: sans-serif; 
        }
        
        /* Amplop dibuat agak besar agar enak diklik */
        #envelope { cursor: pointer; width: 220px; height: 150px; background: #fff; border-radius: 10px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(255,255,255,0.2); }
        .red-dot { width: 35px; height: 35px; background: red; border-radius: 50%; box-shadow: 0 0 20px red; }

        #main-stage { display: none; text-align: center; width: 100%; padding: 20px; }

        /* UKURAN FOTO DIUBAH JADI BESAR */
        .photo-container {
            position: relative;
            display: inline-block;
            width: 90%; /* Mengikuti lebar layar */
            max-width: 500px; /* Batas maksimal agar tidak pecah di laptop */
            margin-bottom: 20px;
        }
        .profile-img {
            width: 100%; /* Foto jadi besar */
            border: 8px solid white;
            border-radius: 20px;
        }

        /* Posisi Mata Laser disesuaikan agar tetap pas walau besar */
        .laser-eye { position: absolute; width: 25%; z-index: 10; }
        .left { top: 22%; left: 15%; }
        .right { top: 22%; right: 15%; }

        /* UKURAN VIDEO DIUBAH JADI BESAR */
        .video-player {
            width: 95%; 
            max-width: 600px; /* Ukuran video jauh lebih besar dari sebelumnya */
            border-radius: 20px; 
            border: 6px solid #ff0000;
            display: none; 
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(255,0,0,0.6);
        }

        /* Animasi */
        .gokil-effect { 
            display: inline-block !important; 
            animation: muter 1.2s forwards, goyang 0.1s infinite 1.2s; 
        }
        @keyframes muter { from { transform: scale(0) rotate(0deg); } to { transform: scale(1) rotate(720deg); } }
        @keyframes goyang { 0% { transform: translate(3px, 3px); } 100% { transform: translate(-3px, -3px); } }

        h1 { color: white; font-size: 2.5rem; text-shadow: 0 0 15px red; margin-top: 0; }
    </style>
</head>
<body>

    <div id="envelope" onclick="mulai()">
        <div class="red-dot"></div>
    </div>

    <div id="main-stage">
        <h1>ACUMALAKA!!</h1>
        
        <div class="photo-container">
            <img src="foto.jpg" class="profile-img">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXF6bm96bm96bm96bm96bm96bm96bm96bm96bm96bm96JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/26AHG5K30O7X3/giphy.gif" class="laser-eye left">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXF6bm96bm96bm96bm96bm96bm96bm96bm96bm96bm96JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/26AHG5K30O7X3/giphy.gif" class="laser-eye right">
        </div>

        <br>

        <video id="v1" class="video-player" onended="nextVideo('v1', 'v2')">
            <source src="video.mp4" type="video/mp4">
        </video>

        <video id="v2" class="video-player" onended="nextVideo('v2', 'v3')">
            <source src="api.mp4" type="video/mp4">
        </video>

        <video id="v3" class="video-player">
            <source src="subscribe.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="lagu" src="newsoul.mp3"></audio>

    <script>
        function mulai() {
            document.getElementById('envelope').style.display = 'none';
            document.getElementById('main-stage').style.display = 'block';
            
            const v1 = document.getElementById('v1');
            v1.classList.add('gokil-effect');
            v1.style.display = 'block';
            v1.play();
            document.getElementById('lagu').play();
        }

        function nextVideo(currentId, nextId) {
            document.getElementById(currentId).style.display = 'none';
            const nextV = document.getElementById(nextId);
            nextV.style.display = 'block';
            nextV.classList.add('gokil-effect');
            nextV.play();
        }
    </script>
</body>
</html>
