<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Surat Gokil Terlengkap</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #envelope { cursor: pointer; width: 180px; height: 120px; background: #fff; border-radius: 5px; display: flex; justify-content: center; align-items: center; }
        .red-dot { width: 25px; height: 25px; background: red; border-radius: 50%; box-shadow: 0 0 15px red; }

        #main-stage { display: none; text-align: center; width: 100%; }

        /* Container Foto & Mata Laser */
        .photo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }
        .profile-img {
            width: 250px;
            border: 5px solid white;
            border-radius: 15px;
        }
        .laser-eye {
            position: absolute;
            width: 60px;
            z-index: 10;
        }
        .left { top: 22%; left: 18%; }
        .right { top: 22%; right: 18%; }

        /* Gaya Video */
        .video-player {
            width: 300px; border-radius: 15px; border: 4px solid #ff0000;
            display: none; margin: 0 auto;
        }

        /* Animasi */
        .gokil-effect { 
            display: inline-block !important; 
            animation: muter 1s forwards, goyang 0.1s infinite 1s; 
        }
        @keyframes muter { from { transform: scale(0) rotate(0deg); } to { transform: scale(1) rotate(720deg); } }
        @keyframes goyang { 0% { transform: translate(2px, 2px); } 100% { transform: translate(-2px, -2px); } }
    </style>
</head>
<body>

    <div id="envelope" onclick="mulai()">
        <div class="envelope-box">
            <div class="red-dot"></div>
        </div>
    </div>

    <div id="main-stage">
        <h1 style="color:white; text-shadow: 0 0 10px red;">ACUMALAKA!!</h1>
        
        <div class="photo-container">
            <img src="foto.jpg" class="profile-img">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXF6bm96bm96bm96bm96bm96bm96bm96bm96bm96bm96JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/26AHG5K30O7X3/giphy.gif" class="laser-eye left">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueXF6bm96bm96bm96bm96bm96bm96bm96bm96bm96bm96JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/26AHG5K30O7X3/giphy.gif" class="laser-eye right">
        </div>

        <br>

        <video id="v1" class="video-player" onended="nextVideo('v1', 'v2')">
            <source src="video.mp4" type="video/mp4">
        </video>

        <video id="v2" class="video-player" onended="nextVideo('v2', 'v3')">
            <source src="api.mp4" type="video/mp4">
        </video>

        <video id="v3" class="video-player">
            <source src="subscribe.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="lagu" src="newsoul.mp3"></audio>

    <script>
        function mulai() {
            document.getElementById('envelope').style.display = 'none';
            document.getElementById('main-stage').style.display = 'block';
            
            const v1 = document.getElementById('v1');
            v1.classList.add('gokil-effect');
            v1.style.display = 'block';
            v1.play();
            document.getElementById('lagu').play();
        }

        function nextVideo(currentId, nextId) {
            document.getElementById(currentId).style.display = 'none';
            const nextV = document.getElementById(nextId);
            nextV.style.display = 'block';
            // Kita kasih efek gokil juga buat video selanjutnya biar mantap
            nextV.classList.add('gokil-effect');
            nextV.play();
        }
    </script>
</body>
</html>
